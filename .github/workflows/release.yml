name: Release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full main commit SHA to release
        required: true
      ci_run_id:
        description: Successful CI push run ID for that exact SHA
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - name: Validate the approved CI run
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.commit_sha }}
          RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          test "$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json workflowName --jq .workflowName)" = "CI"
          test "$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json event --jq .event)" = "push"
          test "$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json headBranch --jq .headBranch)" = "main"
          test "$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = "$SHA"
          test "$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = "success"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.7"
      - name: Derive and validate release identity
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          about = Path("src/pytitect/__about__.py").read_text()
          version = re.fullmatch(r'__version__ = "([^"]+)"\n?', about).group(1)
          match = re.fullmatch(r"(\d+\.\d+\.\d+)(?:rc([1-9]\d*))?", version)
          if match is None:
              raise SystemExit("release workflow accepts only rcN or stable versions")
          stable, candidate = match.groups()
          tag = f"v{stable}-rc.{candidate}" if candidate else f"v{stable}"
          output = Path(os.environ["GITHUB_ENV"])
          with output.open("a") as stream:
              stream.write(f"VERSION={version}\n")
              stream.write(f"TAG={tag}\n")
              stream.write(f"PRERELEASE={'true' if candidate else 'false'}\n")
          PY
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "${{ inputs.commit_sha }}"
      - run: uv sync --all-extras --frozen
      - run: uv run python tool/verify.py --skip-build
      - name: Build release artifacts once
        run: |
          uv run python -m build --no-isolation
          uv run python -m twine check dist/*
          uv run python tool/package_smoke.py dist/*.whl
          cd dist
          sha256sum pytitect-* > SHA256SUMS
      - name: Create SPDX SBOM
        env:
          SOURCE_DATE_EPOCH: "0"
        run: uv run python tool/sbom.py uv.lock "dist/pytitect-${VERSION}.spdx.json"
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Add provenance bundle to release artifacts
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "dist/pytitect-${VERSION}.intoto.jsonl"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytitect-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error
      - name: Create protected annotated tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.commit_sha }}
        run: |
          git config user.name ftr
          git config user.email ftr@tuta.com
          git tag -a "$TAG" "$SHA" -m "Pytitect ${VERSION}"
          git push origin "refs/tags/${TAG}"
          if test "$PRERELEASE" = true; then
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --prerelease --verify-tag --title "Pytitect ${VERSION}" --notes-file CHANGELOG.md
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Pytitect ${VERSION}" --notes-file CHANGELOG.md
          fi
