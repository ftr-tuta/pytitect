name: Event platform expanded matrix

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/pytitect/sqlalchemy/**"
      - "src/pytitect/messaging/**"
      - "src/pytitect/wire.py"
      - "src/pytitect/sync/**"
      - "src/pytitect/django/**"
      - "tests/integration/**"
      - ".github/workflows/event-platform.yml"
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.7"
      - run: uv sync --all-extras --frozen
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: event-platform-candidate
          path: dist/*.whl

  postgres:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "16", "17", "18"]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pytitect_event_platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: event-platform-candidate
          path: candidate-dist
      - run: python -m pip install candidate-dist/*.whl "SQLAlchemy[asyncio]>=2.0.52,<2.1" "psycopg[binary]>=3.3.5,<4" "Django>=5.2.1,<6.2" "nats-py>=2.15,<3" boto3 pytest
      - env:
          TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/pytitect_event_platform
        run: python -m pytest -o addopts='' -m 'postgres and not nats' tests/test_postgresql_leases.py tests/integration

  nats:
    needs: candidate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: event-platform-candidate
          path: candidate-dist
      - run: python -m pip install candidate-dist/*.whl "SQLAlchemy[asyncio]>=2.0.52,<2.1" "psycopg[binary]>=3.3.5,<4" "nats-py>=2.15,<3" boto3 pytest
      - run: >-
          python tool/integration_environment.py --services nats --
          python -m pytest -o addopts='' -m nats tests/integration/test_brokers.py

  localstack:
    needs: candidate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: event-platform-candidate
          path: candidate-dist
      - run: python -m pip install candidate-dist/*.whl "SQLAlchemy[asyncio]>=2.0.52,<2.1" "psycopg[binary]>=3.3.5,<4" "nats-py>=2.15,<3" "boto3>=1.43.88,<2" pytest
      - run: >-
          python tool/integration_environment.py --services localstack --
          python -m pytest -o addopts='' -m localstack tests/integration/test_brokers.py

  soak:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.7"
      - run: uv sync --all-extras --frozen
      - run: >-
          uv run python tool/integration_environment.py --services postgres,nats
          --record evidence/infrastructure.json --
          uv run python -m benchmarks.python.run --scenarios soak --duration 1800
          --rate 20 --drain-timeout 120 --max-requests 100000 --output evidence/soak.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: python-soak-evidence
          path: evidence/
