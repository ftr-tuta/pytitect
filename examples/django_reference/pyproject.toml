[project]
name = "pytitect-django-reference"
version = "1.0.0"
description = "Synthetic Django and PostgreSQL adoption reference for Pytitect"
requires-python = ">=3.12,<3.15"
dependencies = [
  "Django==5.2.16",
  "psycopg[binary]==3.2.10",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-django==4.11.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "reference_project.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.uv]
package = false
