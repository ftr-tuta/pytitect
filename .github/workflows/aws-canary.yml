name: AWS real canary

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  canary:
    environment: aws-canary
    runs-on: ubuntu-24.04
    env:
      PYTITECT_REAL_AWS: "1"
      AWS_REGION: ${{ vars.AWS_CANARY_REGION || 'us-east-1' }}
      RESOURCE_PREFIX: pytitect-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Require explicit canary credentials
        env:
          CANARY_ROLE: ${{ vars.AWS_CANARY_ROLE_ARN }}
        run: test -n "$CANARY_ROLE"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_CANARY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.7"
      - run: uv sync --all-extras --frozen
      - run: uv run python -m pytest --no-cov -m aws_live tests/integration/test_brokers.py
