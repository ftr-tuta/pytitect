version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-development:
        dependency-type: development
    ignore:
      - dependency-name: django
        versions: [">=5.3"]
      - dependency-name: django-stubs
        versions: [">=5.3"]
  - package-ecosystem: uv
    directory: /canaries/django_protocol_matrix
    schedule:
      interval: weekly
    groups:
      django-canary:
        patterns: ["*"]
    ignore:
      - dependency-name: django
        versions: [">=5.3"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
