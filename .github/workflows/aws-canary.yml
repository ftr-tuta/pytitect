name: AWS real canary

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  canary:
    if: ${{ vars.AWS_CANARY_ROLE_ARN != '' }}
    continue-on-error: true
    environment: aws-canary
    runs-on: ubuntu-24.04
    env:
      AWS_REGION: ${{ vars.AWS_CANARY_REGION || 'us-east-1' }}
      RESOURCE_PREFIX: pytitect-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v5.1.1
        with:
          role-to-assume: ${{ vars.AWS_CANARY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.7"
      - run: uv sync --extra aws --frozen
      - run: uv run python -m pytest tests/test_aws_adapter.py
