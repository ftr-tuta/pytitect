name: Release prerelease

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full main commit SHA to release
        required: true
      ci_run_id:
        description: Successful CI workflow run ID for that SHA
        required: true
      version:
        description: Must be 0.9.0a1
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - name: Validate inputs and approved CI run
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.commit_sha }}
          RUN_ID: ${{ inputs.ci_run_id }}
          VERSION: ${{ inputs.version }}
        run: |
          test "$VERSION" = "0.9.0a1"
          test "$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = "$SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --all-extras --frozen
      - run: uv run python tool/verify.py
      - name: Build release artifacts once
        run: |
          uv run python -m build --no-isolation
          uv run python -m twine check dist/*
          uv run python tool/package_smoke.py dist/*.whl
          cd dist
          sha256sum pytitect-* > SHA256SUMS
      - name: Create SPDX SBOM
        env:
          SOURCE_DATE_EPOCH: "0"
        run: uv run python tool/sbom.py uv.lock dist/pytitect-0.9.0a1.spdx.json
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Add provenance bundle to release artifacts
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" dist/pytitect-0.9.0a1.intoto.jsonl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytitect-0.9.0a1
          path: dist/*
          if-no-files-found: error
      - name: Create protected annotated tag and prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.commit_sha }}
        run: |
          git config user.name ftr
          git config user.email ftr@tuta.com
          git tag -a v0.9.0a1 "$SHA" -m "Pytitect 0.9.0a1"
          git push origin refs/tags/v0.9.0a1
          gh release create v0.9.0a1 dist/* --repo "$GITHUB_REPOSITORY" --prerelease --verify-tag --title "Pytitect 0.9.0a1" --notes-file CHANGELOG.md
