name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: CI / Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.7"
      - run: uv sync --all-extras --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .

  typecheck:
    name: CI / Typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.7"
      - run: uv sync --all-extras --frozen
      - run: uv run mypy

  unit-python:
    name: CI / Unit Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.7"
      - run: uv sync --all-extras --frozen
      - run: uv run pytest --no-cov -m "not postgres and not integration"

  unit:
    name: CI / Unit
    if: always()
    needs: [unit-python]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Python unit job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python -c 'import json,os,sys; sys.exit(any(v["result"] != "success" for v in json.loads(os.environ["RESULTS"]).values()))'

  django-minimum:
    name: CI / Django 5.2 minimum
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.7"
      - run: uv sync --all-extras --frozen
      - run: uv pip install "Django==5.2.1" "djangorestframework==3.16.0"
      - run: uv run pytest --no-cov tests/test_django_drf.py

  django-latest:
    name: CI / Django 6.1 latest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.7"
      - run: uv sync --all-extras --frozen
      - run: uv pip install "Django>=6.1,<6.2"
      - run: uv run pytest --no-cov tests/test_django_drf.py

  django-6-0:
    name: CI / Django 6.0
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.7"
      - run: uv sync --all-extras --frozen
      - run: uv pip install "Django>=6.0,<6.1"
      - run: uv run pytest --no-cov tests/test_django_drf.py tests/test_django_event_processing.py

  postgres:
    name: CI / PostgreSQL
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pytitect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/pytitect_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.7"
      - run: uv sync --all-extras --frozen
      - run: uv run pytest --no-cov -m postgres tests/test_postgresql_leases.py

  package:
    name: CI / Package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.7"
      - run: uv sync --all-extras --frozen
      - run: uv run python -m build --no-isolation
      - run: uv run python -m twine check dist/*
      - run: uv run python tool/package_smoke.py dist/*.whl
      - run: uv run python tool/api_snapshot.py
      - run: uv run python tool/sync_bundle.py
      - run: uv run python tool/optional_imports.py
      - run: uv run python tool/release_notes.py --check
      - run: uv run python tool/release_tree.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytitect-candidate-wheel
          path: dist/*.whl
          if-no-files-found: error

  django-canary:
    name: CI / Django protocol matrix
    needs: [package]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pytitect_canary
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pytitect_canary
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: synthetic-ci-only-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.7"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pytitect-candidate-wheel
          path: candidate-dist
      - run: uv sync --project canaries/django_protocol_matrix --frozen
      - name: Install the exact candidate wheel
        run: >-
          uv pip install
          --python canaries/django_protocol_matrix/.venv/bin/python
          candidate-dist/*.whl
      - run: canaries/django_protocol_matrix/.venv/bin/python canaries/django_protocol_matrix/manage.py check
      - run: canaries/django_protocol_matrix/.venv/bin/python canaries/django_protocol_matrix/manage.py migrate --noinput
      - run: canaries/django_protocol_matrix/.venv/bin/python canaries/django_protocol_matrix/manage.py makemigrations --check --dry-run
      - run: canaries/django_protocol_matrix/.venv/bin/python -m pytest canaries/django_protocol_matrix/tests

  django-reference:
    name: CI / Django reference project
    needs: [package]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pytitect_reference
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REFERENCE_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/pytitect_reference
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.7"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pytitect-candidate-wheel
          path: candidate-dist
      - run: uv sync --project examples/django_reference --frozen
      - name: Install the exact candidate wheel
        run: >-
          uv pip install
          --python examples/django_reference/.venv/bin/python
          candidate-dist/*.whl
      - run: examples/django_reference/.venv/bin/python examples/django_reference/manage.py check
      - run: examples/django_reference/.venv/bin/python examples/django_reference/manage.py migrate --noinput
      - run: examples/django_reference/.venv/bin/python examples/django_reference/manage.py makemigrations --check --dry-run
      - run: examples/django_reference/.venv/bin/python -m pytest examples/django_reference
      - run: examples/django_reference/.venv/bin/python tool/reference_project.py

  contracts-security:
    name: CI / Contracts and Security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.7"
      - run: uv sync --all-extras --frozen
      - run: >-
          uv run pytest --no-cov
          tests/test_contracts.py
          tests/test_security.py
          tests/test_sync_bundle.py
          tests/test_sync_contracts.py
          tests/test_trace.py

  event-platform-contracts:
    name: CI / Event platform contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.7"
      - run: uv sync --all-extras --frozen
      - run: >-
          uv run pytest --no-cov
          tests/test_messaging.py
          tests/test_wire.py
          tests/test_wire_conformance.py
          tests/test_aio_runtime.py
          tests/test_aws_adapter.py
          tests/test_nats_adapter.py
          tests/test_processes.py
          tests/test_jobs.py
          tests/test_event_sourcing_projections.py
          tests/test_fault_injection.py
      - run: uv run python tool/message_bundle.py
      - run: uv run python tool/wire_conformance.py
      - run: uv run python tool/event_platform.py

  reliability:
    name: CI / Reliability integrations
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.7"
      - run: uv sync --all-extras --frozen
      - name: Real services, complete coverage and representative capacity
        run: >-
          uv run python tool/integration_environment.py --record evidence/infrastructure.json --
          uv run python tool/reliability_gate.py --output evidence/capacity.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reliability-evidence
          path: evidence/
      - name: Render the architecture roadmap
        run: |
          sudo apt-get update
          sudo apt-get install -y asciidoctor
          asciidoctor --failure-level WARN -o /tmp/roadmap.html docs/large-scale-architecture-roadmap.adoc

  paired:
    name: CI / Paired conformance and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CHROME_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.4"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.7"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true
      - run: uv sync --all-extras --frozen
      - name: Fetch the committed Dart candidate
        run: |
          python - <<'PYTHON'
          import json, os, re, subprocess
          from pathlib import Path
          pin = json.loads(Path("interop/dart/candidate.json").read_text())
          revision = pin["dartSha"]
          if not re.fullmatch("[0-9a-f]{40}", revision):
              raise SystemExit("Dart candidate must be a full committed SHA")
          target = Path(os.environ["RUNNER_TEMP"]) / "dartitect-candidate"
          subprocess.run(["git", "clone", "--no-checkout", "https://github.com/ftr-tuta/dartitect.git", str(target)], check=True)
          subprocess.run(["git", "-C", str(target), "checkout", "--detach", revision], check=True)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"DART_CANDIDATE_ROOT={target}\nDART_CANDIDATE_SHA={revision}\n")
          PYTHON
      - name: Resolve the pinned Dart workspace
        run: |
          cd "$DART_CANDIDATE_ROOT"
          flutter pub get
          git diff --exit-code
      - name: Real paired conformance, recovery and representative capacity
        run: >-
          uv run python tool/integration_environment.py --services postgres,nats
          --record "${{ runner.temp }}/paired-infrastructure.json" --command-timeout 1500 --
          uv run python -m tool.paired_gate
          --dart-root "$DART_CANDIDATE_ROOT" --dart-sha "$DART_CANDIDATE_SHA"
          --mode candidate --output "${{ runner.temp }}/paired-evidence"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: paired-candidate-evidence
          path: |
            ${{ runner.temp }}/paired-evidence/
            ${{ runner.temp }}/paired-infrastructure.json
          retention-days: 90

  required:
    name: CI / Required
    if: always()
    needs: [lint, typecheck, unit, django-minimum, django-6-0, django-latest, postgres, package, django-canary, django-reference, contracts-security, event-platform-contracts, reliability, paired]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every CI job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python -c 'import json,os,sys; sys.exit(any(v["result"] != "success" for v in json.loads(os.environ["RESULTS"]).values()))'
