version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-development:
        dependency-type: development
  - package-ecosystem: uv
    directory: /canaries/django_protocol_matrix
    schedule:
      interval: weekly
    groups:
      django-canary:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
