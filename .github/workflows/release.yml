name: Release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full main commit SHA to release
        required: true
      ci_run_id:
        description: Successful CI push run ID for that exact SHA
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - name: Validate the approved CI run
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.commit_sha }}
          RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" = "$SHA"
          test "$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json workflowName --jq .workflowName)" = "CI"
          test "$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json event --jq .event)" = "push"
          test "$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json headBranch --jq .headBranch)" = "main"
          test "$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = "$SHA"
          test "$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = "success"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.7"
      - name: Derive and validate release identity
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          about = Path("src/pytitect/__about__.py").read_text()
          version = re.fullmatch(r'__version__ = "([^"]+)"\n?', about).group(1)
          match = re.fullmatch(r"(\d+\.\d+\.\d+)(?:rc([1-9]\d*))?", version)
          if match is None:
              raise SystemExit("release workflow accepts only rcN or stable versions")
          stable, candidate = match.groups()
          tag = f"v{stable}-rc.{candidate}" if candidate else f"v{stable}"
          output = Path(os.environ["GITHUB_ENV"])
          with output.open("a") as stream:
              stream.write(f"VERSION={version}\n")
              stream.write(f"TAG={tag}\n")
              stream.write(f"PRERELEASE={'true' if candidate else 'false'}\n")
          PY
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "${{ inputs.commit_sha }}"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Validate existing tag identity
        run: |
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            test "$(git rev-list -n 1 "$TAG")" = "${{ inputs.commit_sha }}" || {
              echo "Existing tag ${TAG} points to a different commit" >&2
              exit 1
            }
            echo "TAG_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "TAG_EXISTS=false" >> "$GITHUB_ENV"
          fi
      - run: uv sync --all-extras --frozen
      - run: uv run python tool/verify.py --skip-build
      - name: Extract this version's release notes
        run: uv run python tool/release_notes.py --version "$VERSION" --output release-notes.md
      - name: Build release artifacts once
        run: |
          uv run python -m build --no-isolation
          uv run python -m twine check dist/*
          uv run python tool/package_smoke.py dist/*.whl
      - name: Create SPDX SBOM
        run: uv run python tool/sbom.py uv.lock "dist/pytitect-${VERSION}.spdx.json"
      - name: Create deterministic artifact hashes
        run: |
          cd dist
          export LC_ALL=C
          sha256sum pytitect-* > SHA256SUMS
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Add provenance bundle to release artifacts
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "dist/pytitect-${VERSION}.intoto.jsonl"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytitect-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error
      - name: Create protected annotated tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.commit_sha }}
        run: |
          git config user.name ftr
          git config user.email ftr@tuta.com
          if test "$TAG_EXISTS" = false; then
            git tag -a "$TAG" "$SHA" -m "Pytitect ${VERSION}"
            git push origin "refs/tags/${TAG}"
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            if test "$PRERELEASE" = true; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --title "Pytitect ${VERSION}" --notes-file release-notes.md
            else
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest --title "Pytitect ${VERSION}" --notes-file release-notes.md
            fi
          elif test "$PRERELEASE" = true; then
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --prerelease --verify-tag --title "Pytitect ${VERSION}" --notes-file release-notes.md
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --latest --verify-tag --title "Pytitect ${VERSION}" --notes-file release-notes.md
          fi
