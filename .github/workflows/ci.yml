name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: CI / Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --all-extras --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .

  typecheck:
    name: CI / Typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --all-extras --frozen
      - run: uv run mypy

  unit-python:
    name: CI / Unit Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --all-extras --frozen
      - run: uv run pytest -m "not postgres"

  unit:
    name: CI / Unit
    if: always()
    needs: [unit-python]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Python unit job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python -c 'import json,os,sys; sys.exit(any(v["result"] != "success" for v in json.loads(os.environ["RESULTS"]).values()))'

  django-minimum:
    name: CI / Django 5.2 minimum
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --all-extras --frozen
      - run: uv pip install "Django==5.2.1" "djangorestframework==3.16.0"
      - run: uv run pytest --no-cov tests/test_django_drf.py

  django-latest:
    name: CI / Django 5.2 latest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --all-extras --frozen
      - run: uv run pytest --no-cov tests/test_django_drf.py

  postgres:
    name: CI / PostgreSQL
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pytitect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/pytitect_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --all-extras --frozen
      - run: uv run pytest --no-cov -m postgres tests/test_postgresql_leases.py

  package:
    name: CI / Package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --all-extras --frozen
      - run: uv run python -m build --no-isolation
      - run: uv run python -m twine check dist/*
      - run: uv run python tool/package_smoke.py dist/*.whl
      - run: uv run python tool/api_snapshot.py
      - run: uv run python tool/optional_imports.py

  contracts-security:
    name: CI / Contracts and Security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --all-extras --frozen
      - run: uv run pytest --no-cov tests/test_contracts.py tests/test_security.py

  required:
    name: CI / Required
    if: always()
    needs: [lint, typecheck, unit, django-minimum, django-latest, postgres, package, contracts-security]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every CI job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python -c 'import json,os,sys; sys.exit(any(v["result"] != "success" for v in json.loads(os.environ["RESULTS"]).values()))'
